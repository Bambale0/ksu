# ROXY durable public feed and reference media.
#
# The app container and generation worker share ./static/uploads through the
# bind mount in docker-compose.yml. Point these aliases at the same host
# directory used by the production checkout (adjust /opt/ksu if needed).
#
# Keep these locations before the generic reverse-proxy location / block.
location ^~ /uploads/feed/ {
    alias /opt/ksu/static/uploads/feed/;

    limit_except GET HEAD {
        deny all;
    }

    autoindex off;
    sendfile on;
    tcp_nopush on;

    add_header Cache-Control "public, max-age=31536000, s-maxage=31536000, immutable" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Content-Type-Options "nosniff" always;

    # nginx handles HTTP Range automatically for regular files, which is
    # required for reliable video seeking/preload in the Mini App feed.
    try_files $uri =404;
}

# Reusable references are content-addressed product-owned media. They remain
# available to the user's Mini App library while provider-specific upload URLs
# are created just in time by generation-worker.
location ^~ /uploads/refs/ {
    alias /opt/ksu/static/uploads/refs/;

    limit_except GET HEAD {
        deny all;
    }

    autoindex off;
    sendfile on;
    tcp_nopush on;

    add_header Cache-Control "public, max-age=31536000, s-maxage=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}
