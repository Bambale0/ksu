# ROXY durable public feed media.
#
# The app container writes ./static/uploads/feed through the bind mount in
# docker-compose.yml. Point this alias at the same host directory used by the
# production checkout (adjust /opt/ksu if the repository lives elsewhere).
#
# Keep this location before the generic reverse-proxy location / block.
location ^~ /uploads/feed/ {
    alias /opt/ksu/static/uploads/feed/;

    limit_except GET HEAD {
        deny all;
    }

    autoindex off;
    sendfile on;
    tcp_nopush on;

    add_header Cache-Control "public, max-age=31536000, s-maxage=31536000, immutable" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Content-Type-Options "nosniff" always;

    # nginx handles HTTP Range automatically for regular files, which is
    # required for reliable video seeking/preload in the Mini App feed.
    try_files $uri =404;
}
