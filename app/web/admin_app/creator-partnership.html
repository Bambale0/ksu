<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>ROXY · Партнёры</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/admin-app/creator-partnership.css?v=20261106-pagination">
</head>
<body>
  <main class="cp-shell">
    <header class="cp-head">
      <div>
        <span class="kicker">ROXY</span>
        <h1>Партнёрские условия</h1>
        <p>Заявки авторов и каналов, персональные условия и начисления.</p>
      </div>
      <a data-preserve-launch href="/admin-app/" class="secondary">← Основная админка</a>
    </header>

    <section id="authPanel" class="panel auth-panel">
      <h2>Вход администратора</h2>
      <p>Откройте страницу через Telegram. Если включена дополнительная защита, введите 6-значный код.</p>
      <form id="loginForm">
        <input id="loginOtp" inputmode="numeric" maxlength="6" placeholder="Код подтверждения · если требуется">
        <button type="submit">Войти</button>
      </form>
      <div id="authMessage" class="message" role="status"></div>
    </section>

    <section id="consolePanel" hidden>
      <div class="toolbar">
        <div id="adminIdentity"></div>
        <button id="refreshButton" class="secondary" type="button">Обновить</button>
      </div>
      <div id="summary" class="metrics"></div>

      <section class="panel">
        <div class="panel-head">
          <div><span class="kicker">Заявки</span><h2>Заявки</h2></div>
          <select id="statusFilter">
            <option value="">Все</option>
            <option value="pending">На рассмотрении</option>
            <option value="approved">Одобрены</option>
            <option value="rejected">Отклонены</option>
          </select>
        </div>
        <div id="applications" class="cards"></div>
        <div id="applicationsPagination"></div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <div><span class="kicker">Соглашения</span><h2>Соглашения</h2></div>
        </div>
        <div id="agreements" class="cards"></div>
        <div id="agreementsPagination"></div>
      </section>
    </section>

    <div id="toast" class="toast" hidden></div>
  </main>
  <script src="/admin-app/admin-pagination.js?v=20261106-pagination"></script>
  <script src="/admin-app/creator-partnership.js?v=20261106-pagination"></script>
  <script src="/admin-app/admin-navigation.js"></script>
</body>
</html>
