<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>Ксю · Рабочий контур</title>
  <link rel="stylesheet" href="/admin-app/admin.css">
  <link rel="stylesheet" href="/admin-app/control.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="/admin-app/control.js" defer></script>
</head>
<body>
  <div class="admin-auth" id="controlAuth">
    <section class="auth-card" aria-labelledby="controlAuthTitle">
      <div class="brand-mark" aria-hidden="true">К</div>
      <span class="eyebrow">Ксю</span>
      <h1 id="controlAuthTitle">Операторский контур</h1>
      <p class="muted">Отдельный защищённый раздел для ежедневной работы.</p>
      <form id="controlLogin" class="stack">
        <label class="field"><span>Код подтверждения</span><input id="controlOtp" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="123456"></label>
        <label class="field"><span>Резервный код</span><input id="controlRecovery" autocomplete="off" maxlength="128"></label>
        <button class="primary" type="submit">Войти</button>
      </form>
      <div class="form-message" id="controlLoginMessage" role="status"></div>
      <a class="table-action control-back-link" href="/admin-app/">Основная админка</a>
    </section>
  </div>

  <div class="control-shell" id="controlShell" hidden>
    <aside class="control-nav-wrap">
      <div class="sidebar-brand">
        <div class="brand-mark small" aria-hidden="true">К</div>
        <div><strong>Ксю</strong><small>рабочий контур</small></div>
      </div>
      <div class="admin-identity" id="controlIdentity"></div>
      <nav id="controlNav" class="control-nav" aria-label="Разделы рабочего контура"></nav>
      <div class="control-nav-footer">
        <a class="table-action" href="/admin-app/">← Основная админка</a>
        <button class="ghost danger-text" id="controlLogout" type="button">Выйти</button>
      </div>
    </aside>

    <main class="control-workspace">
      <header class="topbar control-topbar">
        <div>
          <span class="eyebrow" id="controlKicker">Обзор</span>
          <h1 id="controlTitle">Обзор</h1>
        </div>
        <div class="topbar-actions">
          <span class="status-dot"><i></i><span id="controlSessionStatus">Доступ подтверждён</span></span>
          <button class="icon-button" id="controlRefresh" type="button" aria-label="Обновить">↻</button>
        </div>
      </header>
      <section class="control-view" id="controlView" aria-live="polite"></section>
    </main>
  </div>

  <dialog class="admin-dialog" id="controlStepDialog">
    <div class="dialog-card">
      <span class="eyebrow">Подтверждение</span>
      <h2>Свежая проверка</h2>
      <p class="muted" id="controlStepDescription">Для этого действия нужен свежий код подтверждения.</p>
      <label class="field"><span>Код подтверждения</span><input id="controlStepOtp" inputmode="numeric" autocomplete="one-time-code" maxlength="8"></label>
      <label class="field"><span>Резервный код</span><input id="controlStepRecovery" autocomplete="off" maxlength="128"></label>
      <div class="form-message" id="controlStepMessage" role="status"></div>
      <div class="dialog-actions">
        <button class="ghost" id="controlStepCancel" type="button">Отмена</button>
        <button class="primary" id="controlStepVerify" type="button">Подтвердить код</button>
      </div>
    </div>
  </dialog>

  <dialog class="admin-dialog" id="controlFormDialog">
    <form class="dialog-card" id="controlForm">
      <span class="eyebrow" id="controlFormKicker">Действие</span>
      <h2 id="controlFormTitle">Действие</h2>
      <div id="controlFormFields" class="stack"></div>
      <div class="form-message" id="controlFormMessage" role="status"></div>
      <div class="dialog-actions">
        <button class="ghost" id="controlFormCancel" type="button">Отмена</button>
        <button class="primary" id="controlFormSubmit" type="submit">Выполнить</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="controlToast" role="status" aria-live="polite" hidden></div>
</body>
</html>
