      <circle cx="306" cy="37" r="17" fill="#FF5FB7" fill-opacity="0.2" stroke="#FF5FB7" stroke-opacity="0.7"/>
      <path d="M306 27v20M296 37h20" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
      <text x="336" y="46" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="750">До 35% дохода</text>

