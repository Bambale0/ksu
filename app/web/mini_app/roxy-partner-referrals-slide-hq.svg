  <circle cx="1680" cy="260" r="390" fill="url(#orbA)" filter="url(#blur72)"/>
  <circle cx="1820" cy="910" r="350" fill="url(#orbB)" filter="url(#blur72)"/>
  <path d="M1200 85C1520 230 1510 430 1860 510C2020 546 2100 492 2190 438" fill="none" stroke="url(#accent)" stroke-opacity="0.16" stroke-width="3"/>
  <path d="M1150 1030C1460 822 1600 925 1970 720" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>

