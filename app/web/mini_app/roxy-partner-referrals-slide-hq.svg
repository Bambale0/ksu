<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="1152" viewBox="0 0 2048 1152" role="img" aria-labelledby="title desc">
  <title id="title">ROXY — до 35% с пополнений рефералов</title>
  <desc id="desc">Партнёрская программа ROXY в фирменной фиолетово-розовой палитре.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0B10"/>
      <stop offset="0.54" stop-color="#13101D"/>
      <stop offset="1" stop-color="#0B0B10"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9B5CFF"/>
      <stop offset="1" stop-color="#FF5FB7"/>
    </linearGradient>
    <radialGradient id="orbA" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#9B5CFF" stop-opacity="0.72"/>
      <stop offset="0.55" stop-color="#9B5CFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#9B5CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbB" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FF5FB7" stop-opacity="0.62"/>
      <stop offset="0.55" stop-color="#FF5FB7" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#FF5FB7" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur72" x="-60%" y="-60%" width="220%" height="220%">
