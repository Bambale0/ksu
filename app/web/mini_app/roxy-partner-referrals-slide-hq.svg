    <text x="104" y="529" text-anchor="middle" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800">+</text>
    <text x="456" y="529" text-anchor="middle" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800">+</text>
    <rect x="130" y="566" width="300" height="36" rx="18" fill="url(#accent)" fill-opacity="0.18"/>
    <text x="280" y="590" text-anchor="middle" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="800" letter-spacing="2">ТВОЯ СЕТЬ РАСТЁТ</text>
