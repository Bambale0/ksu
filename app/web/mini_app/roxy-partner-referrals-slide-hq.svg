      <circle cx="618" cy="37" r="17" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.26"/>
      <path d="M609 39h18M615 31l-6 8 6 8" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="648" y="46" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="750">В кабинете</text>
