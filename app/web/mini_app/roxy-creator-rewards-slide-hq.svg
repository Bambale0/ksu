<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="1152" viewBox="0 0 2048 1152" role="img" aria-labelledby="title desc">
  <title id="title">ROXY — создавай, публикуй, зарабатывай</title>
  <desc id="desc">Creator Rewards: создавай контент, публикуй работы и получай ROX.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0B10"/>
      <stop offset="0.5" stop-color="#111019"/>
      <stop offset="1" stop-color="#0B0B10"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9B5CFF"/>
      <stop offset="0.54" stop-color="#C15FFF"/>
      <stop offset="1" stop-color="#FF5FB7"/>
    </linearGradient>
    <linearGradient id="accentText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B98BFF"/>
      <stop offset="1" stop-color="#FF78C6"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#9B5CFF" stop-opacity="0.62"/>
      <stop offset="0.62" stop-color="#9B5CFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#9B5CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FF5FB7" stop-opacity="0.54"/>
      <stop offset="0.62" stop-color="#FF5FB7" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#FF5FB7" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur80" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="80"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="30" stdDeviation="40" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <pattern id="dots" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#FFFFFF" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="2048" height="1152" rx="72" fill="url(#bg)"/>
  <rect width="2048" height="1152" rx="72" fill="url(#dots)"/>
  <circle cx="1660" cy="210" r="390" fill="url(#glowA)" filter="url(#blur80)"/>
  <circle cx="1720" cy="900" r="430" fill="url(#glowB)" filter="url(#blur80)"/>

  <g transform="translate(112 90)">
    <rect width="78" height="78" rx="24" fill="none" stroke="url(#accent)" stroke-width="3"/>
    <text x="39" y="52" text-anchor="middle" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="900" letter-spacing="-2">RX</text>
    <text x="100" y="34" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="900" letter-spacing="4">ROXY</text>
    <text x="100" y="64" fill="#A6A6B3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="5">CREATOR REWARDS</text>
  </g>

  <g transform="translate(112 290)">
    <text x="0" y="0" fill="#A6A6B3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="800" letter-spacing="4">ТВОЙ КОНТЕНТ · ТВОЯ АУДИТОРИЯ · ТВОИ ROX</text>
    <text x="0" y="145" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="118" font-weight="950" letter-spacing="-6">СОЗДАВАЙ.</text>
    <text x="0" y="275" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="118" font-weight="950" letter-spacing="-6">ПУБЛИКУЙ.</text>
    <text x="0" y="405" fill="url(#accentText)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="118" font-weight="950" letter-spacing="-6">ЗАРАБАТЫВАЙ.</text>
    <text x="0" y="486" fill="#A6A6B3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="29" font-weight="600">Превращай генерации в портфолио и получай вознаграждения внутри ROXY.</text>

    <g transform="translate(0 570)">
      <g>
        <circle cx="32" cy="32" r="32" fill="#9B5CFF" fill-opacity="0.18" stroke="#9B5CFF" stroke-opacity="0.52"/>
        <text x="32" y="41" text-anchor="middle" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="900">1</text>
        <text x="82" y="25" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800">Создай работу</text>
        <text x="82" y="53" fill="#A6A6B3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600">Фото или видео</text>
      </g>
      <g transform="translate(310 0)">
        <circle cx="32" cy="32" r="32" fill="#C15FFF" fill-opacity="0.18" stroke="#C15FFF" stroke-opacity="0.52"/>
        <text x="32" y="41" text-anchor="middle" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="900">2</text>
        <text x="82" y="25" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800">Опубликуй</text>
        <text x="82" y="53" fill="#A6A6B3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600">В ленте ROXY</text>
      </g>
      <g transform="translate(585 0)">
        <circle cx="32" cy="32" r="32" fill="#FF5FB7" fill-opacity="0.18" stroke="#FF5FB7" stroke-opacity="0.52"/>
        <text x="32" y="41" text-anchor="middle" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="900">3</text>
        <text x="82" y="25" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800">Получай ROX</text>
        <text x="82" y="53" fill="#A6A6B3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600">За активность</text>
      </g>
    </g>
  </g>

  <g transform="translate(1392 188) rotate(3 260 365)" filter="url(#shadow)">
    <rect width="520" height="730" rx="58" fill="#111018" stroke="#FFFFFF" stroke-opacity="0.13" stroke-width="2"/>
    <rect x="26" y="26" width="468" height="520" rx="40" fill="#15131E" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <circle cx="342" cy="142" r="165" fill="url(#glowA)"/>
    <circle cx="166" cy="368" r="188" fill="url(#glowB)"/>
    <path d="M95 415C150 318 214 258 324 235C374 224 416 229 455 248V486H65V458C75 442 84 428 95 415Z" fill="url(#accent)" fill-opacity="0.28"/>
    <circle cx="260" cy="242" r="86" fill="#1C1926" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="2"/>
    <path d="M220 243c0-24 18-43 40-43s40 19 40 43-18 43-40 43-40-19-40-43Zm-47 145c15-54 45-80 87-80s72 26 87 80" fill="none" stroke="#FFFFFF" stroke-opacity="0.84" stroke-width="13" stroke-linecap="round"/>
    <rect x="54" y="574" width="412" height="56" rx="20" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <circle cx="87" cy="602" r="13" fill="#9B5CFF"/>
    <rect x="113" y="592" width="176" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.78"/>
    <rect x="113" y="610" width="112" height="8" rx="4" fill="#A6A6B3" fill-opacity="0.44"/>
    <path d="M398 593l14 14 28-32" fill="none" stroke="#FF5FB7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="54" y="650" width="412" height="44" rx="22" fill="url(#accent)"/>
    <text x="260" y="679" text-anchor="middle" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="900" letter-spacing="2">ОПУБЛИКОВАТЬ</text>
  </g>

  <path d="M1240 160c195 58 218 182 420 188" fill="none" stroke="url(#accent)" stroke-opacity="0.18" stroke-width="3"/>
  <path d="M1210 962c230-142 380-76 650-190" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="2"/>
  <rect x="80" y="80" width="1888" height="992" rx="56" fill="none" stroke="#FFFFFF" stroke-opacity="0.055" stroke-width="2"/>
</svg>
