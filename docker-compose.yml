services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ksu
      POSTGRES_USER: ksu
      POSTGRES_PASSWORD: ksu
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ksu -d ksu"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    env_file: .env
    volumes:
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"

  generation-worker:
    build: .
    env_file: .env
    volumes:
      - ./logs:/app/logs
    depends_on:
      app:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python -m app.workers.generation

  media-worker:
    build: .
    env_file: .env
    volumes:
      - ./logs:/app/logs
    depends_on:
      app:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python -m app.workers.media

  payment-worker:
    build: .
    env_file: .env
    volumes:
      - ./logs:/app/logs
    depends_on:
      app:
        condition: service_started
      postgres:
        condition: service_healthy
    command: python -m app.workers.payments

  notification-worker:
    build: .
    env_file: .env
    volumes:
      - ./logs:/app/logs
    depends_on:
      app:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python -m app.workers.notifications

  admin-campaign-worker:
    build: .
    env_file: .env
    volumes:
      - ./logs:/app/logs
    depends_on:
      app:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python -m app.workers.admin_campaigns

  creator-partnership-worker:
    build: .
    env_file: .env
    volumes:
      - ./logs:/app/logs
    depends_on:
      app:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python -m app.workers.creator_partnership

  backup-worker:
    image: postgres:17-alpine
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./scripts/backup_postgres.sh:/opt/ksu/backup_postgres.sh:ro
      - db_backups:/backups
    command: ["/bin/sh", "/opt/ksu/backup_postgres.sh"]
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  db_backups:
