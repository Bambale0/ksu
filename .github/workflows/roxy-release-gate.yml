name: ROXY Release Gate

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "frontend/mini-app/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/deploy-production.yml"
      - "scripts/check_roxy_release.py"
      - "tests/test_next_mini_app_contract.py"
      - "docs/ROXY_DESIGN_SYSTEM.md"
      - ".github/workflows/roxy-release-gate.yml"
  workflow_dispatch:

concurrency:
  group: roxy-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Mini App dependencies
        working-directory: frontend/mini-app
        run: npm install --no-audit --no-fund

      - name: Typecheck
        working-directory: frontend/mini-app
        run: npm run typecheck

      - name: Build static Mini App
        working-directory: frontend/mini-app
        run: npm run build

      - name: Verify export
        run: |
          test -f frontend/mini-app/out/index.html
          test -d frontend/mini-app/out/_next
          grep -q '/mini-app/_next/' frontend/mini-app/out/index.html

      - name: ROXY architecture contract
        run: python scripts/check_roxy_release.py
