name: Diagnose Qwen Prompt Primary

on:
  push:
    branches: [diagnostic/qwen-prompt-primary-20261029]

permissions:
  contents: read

concurrency:
  group: qwen-prompt-diagnostic
  cancel-in-progress: true

jobs:
  admin-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/mini-app/package-lock.json
      - name: Install Mini App test dependencies
        working-directory: frontend/mini-app
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save @playwright/test@1.56.1 --no-audit --no-fund
      - name: Install Chromium
        working-directory: frontend/mini-app
        run: npx playwright install --with-deps chromium
      - name: Run isolated real admin controls
        working-directory: frontend/mini-app
        run: |
          cat > playwright.qwen-diagnostic.config.mjs <<'CONFIG'
          import base from './playwright.config.mjs';
          export default {
            ...base,
            webServer: undefined,
            testMatch: 'admin-prompt-tool-routes.spec.mjs',
            workers: 1,
            reporter: [['list'], ['html', { outputFolder: 'qwen-admin-report', open: 'never' }]],
            projects: base.projects.filter(project => project.name === 'chromium'),
          };
          CONFIG
          set +e
          PLAYWRIGHT_JSON_OUTPUT_FILE=qwen-admin-red.json npx playwright test --config=playwright.qwen-diagnostic.config.mjs --reporter=list,json > qwen-admin-red.log 2>&1
          result=$?
          set -e
          cat qwen-admin-red.log
          test "$result" -eq 1
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("qwen-admin-red.json").read_text())
          def specs(suite):
              found=list(suite.get("specs", []))
              for child in suite.get("suites", []):
                  found.extend(specs(child))
              return found
          cases=[case for suite in report["suites"] for case in specs(suite)]
          assert len(cases)==2, "Expected exactly the two original admin cases"
          for case in cases:
              result=case["tests"][0]["results"][-1]
              errors="\n".join(error.get("message", "") for error in result.get("errors", []))
              assert result["status"] in {"failed", "timedOut"}, result
              assert "getByLabel" in errors and "Описание по фото" in errors, errors
          print("RED_CONFIRMED: both original exact-label selectors fail at the photo control")
          PY
      - name: Apply reviewed selector-only fixture fix
        working-directory: frontend/mini-app
        run: |
          python3 - <<'PY'
          import base64, hashlib
          from pathlib import Path
          content=base64.b64decode("")
          assert hashlib.sha1(b"blob "+str(len(content)).encode()+b"\0"+content).hexdigest()=="af70ef3cc88c1ee426ba44c50294ec6405afe0cc"
          Path("e2e/admin-prompt-tool-routes.spec.mjs").write_bytes(content)
          PY
      - name: Verify fixed admin controls GREEN
        working-directory: frontend/mini-app
        run: npx playwright test --config=playwright.qwen-diagnostic.config.mjs
      - name: Preserve exact failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen-admin-focused
          path: |
            frontend/mini-app/qwen-admin-report
            frontend/mini-app/test-results
            frontend/mini-app/qwen-admin-red.json
            frontend/mini-app/qwen-admin-red.log
          retention-days: 7
