name: Diagnose Qwen Prompt Primary

on:
  push:
    branches: [diagnostic/qwen-prompt-primary-20261029]

permissions:
  contents: read

concurrency:
  group: qwen-prompt-diagnostic
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ksu
          POSTGRES_USER: ksu
          POSTGRES_PASSWORD: ksu
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U ksu -d ksu"
          --health-interval 5s --health-timeout 3s --health-retries 15
      redis:
        image: redis:7.4-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      APP_ENV: test
      KSU_ALLOW_TEST_DATABASE: "1"
      DATABASE_URL: postgresql+asyncpg://ksu:ksu@127.0.0.1:5432/ksu
      REDIS_URL: redis://127.0.0.1:6379/0
      BOT_TOKEN: ""
      TELEGRAM_WEBHOOK_SECRET: test-secret
      ONBOARDING_ENABLED: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend dependencies
        run: python -m pip install -e '.[dev]'
      - name: Apply isolated test migrations
        run: alembic upgrade head
      - name: Qwen primary admission regression
        run: pytest -q tests/test_prompt_tool_qwen_primary.py
