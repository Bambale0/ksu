name: Diagnose Qwen Prompt Primary

on:
  push:
    branches: [diagnostic/qwen-prompt-primary-20261029]

permissions:
  contents: read

concurrency:
  group: qwen-prompt-diagnostic
  cancel-in-progress: true

jobs:
  chromium-upload-deadline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Mini App dependencies
        working-directory: frontend/mini-app
        run: npm ci --no-audit --no-fund
      - name: Install matching Playwright runtime
        working-directory: frontend/mini-app
        run: npm install --no-save @playwright/test@1.56.1 --no-audit --no-fund
      - name: Capture large upload deadline clock and abort ordering
        working-directory: frontend/mini-app
        run: npx playwright test e2e/roxy-system-risk-scenarios.spec.mjs --project=chromium --grep "large trend preview upload scales the deadline" --repeat-each=30 --workers=2 --retries=0
      - name: Preserve upload deadline diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-upload-deadline-ordering
          path: |
            frontend/mini-app/playwright-report
            frontend/mini-app/test-results
          retention-days: 7
