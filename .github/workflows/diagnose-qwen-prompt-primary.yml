name: Diagnose Qwen Prompt Primary

on:
  push:
    branches: [diagnostic/qwen-prompt-primary-20261029]

permissions:
  contents: read

concurrency:
  group: qwen-prompt-diagnostic
  cancel-in-progress: true

jobs:
  admin-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/mini-app/package-lock.json
      - name: Install Mini App test dependencies
        working-directory: frontend/mini-app
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        working-directory: frontend/mini-app
        run: npx playwright install --with-deps chromium
      - name: Run isolated real admin controls
        working-directory: frontend/mini-app
        run: |
          cat > playwright.qwen-diagnostic.config.mjs <<'CONFIG'
          import base from './playwright.config.mjs';
          export default {
            ...base,
            webServer: undefined,
            testMatch: 'admin-prompt-tool-routes.spec.mjs',
            workers: 1,
            reporter: [['list'], ['html', { outputFolder: 'qwen-admin-report', open: 'never' }]],
            projects: base.projects.filter(project => project.name === 'chromium'),
          };
          CONFIG
          npx playwright test --config=playwright.qwen-diagnostic.config.mjs
      - name: Preserve exact failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen-admin-focused
          path: |
            frontend/mini-app/qwen-admin-report
            frontend/mini-app/test-results
          retention-days: 7
