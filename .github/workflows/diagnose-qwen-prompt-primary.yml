name: Diagnose Qwen Prompt Primary

on:
  push:
    branches: [diagnostic/qwen-prompt-primary-20261029]

permissions:
  contents: read

concurrency:
  group: qwen-prompt-diagnostic
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ksu
          POSTGRES_USER: ksu
          POSTGRES_PASSWORD: ksu
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U ksu -d ksu"
          --health-interval 5s --health-timeout 3s --health-retries 15
      redis:
        image: redis:7.4-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      APP_ENV: test
      KSU_ALLOW_TEST_DATABASE: "1"
      DATABASE_URL: postgresql+asyncpg://ksu:ksu@127.0.0.1:5432/ksu
      REDIS_URL: redis://127.0.0.1:6379/0
      BOT_TOKEN: ""
      TELEGRAM_WEBHOOK_SECRET: test-secret
      ONBOARDING_ENABLED: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify video tooling
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
            sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Install backend dependencies
        run: python -m pip install -e '.[dev]'
      - name: Ruff changed implementation and tests
        run: ruff check app tests --output-format=github
      - name: Compile backend
        run: python -m compileall -q app tests
      - name: Apply isolated test migrations
        run: alembic upgrade head
      - name: Verify ORM migration parity
        run: alembic check
      - name: Qwen primary focused regression
        run: >-
          pytest -q --tb=short
          tests/test_neironych_qwen_prompt_tools.py
          tests/test_prompt_tool_qwen_primary.py
          tests/test_prompt_tool_routing.py
          tests/test_prompt_tools.py
          tests/test_nexus_prompt_media.py
          tests/test_nexus_prompt_tools_gpt55.py
          tests/test_kie_prompt_tools_gpt55.py
          tests/test_prompt_tool_worker_contract.py
          tests/test_prompt_tools_video_transport_regression.py
          tests/test_tanyapi_photo_prompt_parity.py
          tests/test_tanyapi_video_prompt_parity.py
          tests/test_prompt_tool_pricing_contract.py
          tests/test_prompt_tools_copy_contract.py
          tests/test_neironych_submission_protocol.py
