name: Mini App Playwright E2E

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'frontend/mini-app/**'
      - '.github/workflows/miniapp-playwright.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: miniapp-playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/mini-app/package-lock.json
      - name: Install Mini App dependencies
        working-directory: frontend/mini-app
        run: npm ci
      - name: Install Playwright test runtime
        working-directory: frontend/mini-app
        run: npm install --no-save @playwright/test@1.56.1
      - name: Install Playwright browsers
        working-directory: frontend/mini-app
        run: npx playwright install --with-deps chromium webkit
      - name: Run 300-scenario Mini App audit
        working-directory: frontend/mini-app
        run: npx playwright test --project=chromium
      - name: Run iPhone/iPad WebKit responsive and crash audit
        working-directory: frontend/mini-app
        run: >-
          npx playwright test
          e2e/client-error-reporting.spec.mjs
          e2e/video-mode-selector-parity.spec.mjs
          e2e/responsive-device-surfaces.spec.mjs
          e2e/responsive-deep-surfaces.spec.mjs
          --project=webkit-mobile
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miniapp-playwright-report
          path: frontend/mini-app/playwright-report
          if-no-files-found: ignore
