name: Mini App Playwright E2E

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'frontend/mini-app/**'
      - 'docker-compose.yml'
      - '.github/workflows/deploy-production.yml'
      - '.github/workflows/miniapp-playwright.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: miniapp-playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/mini-app/package-lock.json
      - name: Install Mini App dependencies
        working-directory: frontend/mini-app
        run: npm ci
      - name: Install Playwright test runtime
        working-directory: frontend/mini-app
        run: npm install --no-save @playwright/test@1.56.1
      - name: Install Playwright browsers
        working-directory: frontend/mini-app
        run: npx playwright install --with-deps chromium webkit
      - name: Run 300-scenario Mini App audit
        working-directory: frontend/mini-app
        run: npx playwright test --project=chromium
      - name: Run iPhone/iPad WebKit responsive and crash audit
        working-directory: frontend/mini-app
        run: >-
          npx playwright test
          --project=iphone-13
          --project=iphone-13-landscape
          --project=iphone-se
          --project=iphone-se-landscape
          --project=ipad-mini
          --project=ipad-mini-landscape
          --project=ipad-pro-11
          --project=ipad-pro-11-landscape
          e2e/responsive-deep-surfaces.spec.mjs
          e2e/responsive-video-generation.spec.mjs
          e2e/responsive-history-generation-detail.spec.mjs
          e2e/responsive-overflow-stress.spec.mjs
          e2e/all-user-surfaces.spec.mjs
          e2e/user-flow-coverage.spec.mjs
          e2e/trend-library.spec.mjs
          e2e/video-generation-modes.spec.mjs
