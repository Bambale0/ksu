name: Mini App E2E

on:
  pull_request:
    paths:
      - "frontend/mini-app/**"
      - ".github/workflows/miniapp-e2e.yml"
  push:
    branches: [main]
    paths:
      - "frontend/mini-app/**"
      - ".github/workflows/miniapp-e2e.yml"

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend/mini-app
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/mini-app/package-lock.json
      - name: Install Mini App dependencies
        run: npm ci
      - name: Install Playwright runner
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run 100 scenario E2E suite
        run: npx playwright test --config=playwright.config.ts
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: miniapp-playwright-report
          path: frontend/mini-app/playwright-report
          if-no-files-found: ignore
          retention-days: 7
