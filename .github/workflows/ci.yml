name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ksu
          POSTGRES_USER: ksu
          POSTGRES_PASSWORD: ksu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ksu -d ksu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://ksu:ksu@127.0.0.1:5432/ksu
      REDIS_URL: redis://127.0.0.1:6379/0
      BOT_TOKEN: ""
      TELEGRAM_WEBHOOK_SECRET: test-secret
      ONBOARDING_ENABLED: "false"

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Ruff
        run: ruff check . --output-format=github

      - name: Compile
        run: python -m compileall -q app tests

      - name: Validate Mini App JavaScript
        run: |
          # Keep the explicit social contract used by the history/social regression gate.
          node --check app/web/mini_app/social.js
          # And validate every current/future Mini App script so new surfaces cannot bypass syntax CI.
          find app/web/mini_app -maxdepth 1 -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check

      - name: Apply migrations
        run: alembic upgrade head

      - name: Feed domain tests
        run: pytest -q tests/test_feed_domain.py

      - name: Feed remix tests
        run: pytest -q tests/test_feed_remix.py

      - name: Feed deep-link and UI contracts
        run: >-
          pytest -q
          tests/test_feed_deep_links.py
          tests/test_feed_bot_callbacks.py
          tests/test_feed_ui_contract.py

      - name: Trends contracts
        run: pytest -q tests/test_trends_contract.py tests/test_trends_service.py

      - name: Prompt Tools contracts
        run: pytest -q tests/test_prompt_tools_contract.py tests/test_prompt_tools.py

      - name: Batch generation contracts
        run: pytest -q tests/test_generation_batches.py tests/test_batch_recovery.py

      - name: Embedded Batch contracts
        run: pytest -q tests/test_roxy_embedded_batch.py

      - name: Studio shell contracts
        run: pytest -q tests/test_studio_shell_contract.py

      - name: ROXY brand contracts
        run: pytest -q tests/test_roxy_brand_contract.py

      - name: ROXY customer navigation contracts
        run: pytest -q tests/test_roxy_customer_navigation.py

      - name: ROXY discovery contracts
        run: pytest -q tests/test_roxy_discovery.py

      - name: ROXY Create center contracts
        run: pytest -q tests/test_roxy_create_center.py

      - name: ROXY Music generation contracts
        run: pytest -q tests/test_music_generation.py

      - name: ROXY Telegram mobile acceptance contracts
        run: pytest -q tests/test_roxy_mobile_acceptance.py

      - name: ROXY Profile cabinet contracts
        run: pytest -q tests/test_roxy_profile_cabinet.py

      - name: ROXY frontend parity and FHD contracts
        run: pytest -q tests/test_roxy_frontend_parity.py

      - name: ROXY economy contracts
        run: >-
          pytest -q
          tests/test_roxy_economy.py
          tests/test_internal_credits.py
          tests/test_roxy_pricing_denomination.py

      - name: Payment surface contracts
        run: pytest -q tests/test_payment_surface_contract.py

      - name: Full regression suite
        id: regression
        shell: bash
        run: |
          set +e
          pytest -q -x --tb=short 2>&1 | tee /tmp/pytest-regression.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "--- regression tail ---"
            tail -n 120 /tmp/pytest-regression.log
            grep -E "FAILED|ERROR|AssertionError|TypeError|AttributeError|KeyError|IntegrityError" /tmp/pytest-regression.log | tail -n 30 | while IFS= read -r line; do
              echo "::error title=Pytest regression::$line"
            done
            exit "$code"
          fi

      - name: Upload regression diagnostics
        if: failure() && steps.regression.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: pytest-regression-log
          path: /tmp/pytest-regression.log
          if-no-files-found: error
          retention-days: 7
