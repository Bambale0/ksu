name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ksu
          POSTGRES_USER: ksu
          POSTGRES_PASSWORD: ksu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ksu -d ksu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://ksu:ksu@127.0.0.1:5432/ksu
      REDIS_URL: redis://127.0.0.1:6379/0
      BOT_TOKEN: ""
      TELEGRAM_WEBHOOK_SECRET: test-secret
      ONBOARDING_ENABLED: "false"

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Install Mini App dependencies
        working-directory: frontend/mini-app
        run: npm install --no-audit --no-fund

      - name: Typecheck Next Mini App
        working-directory: frontend/mini-app
        run: npm run typecheck

      - name: Build Next Mini App
        working-directory: frontend/mini-app
        run: npm run build

      - name: Verify static export
        run: |
          test -f frontend/mini-app/out/index.html
          test -d frontend/mini-app/out/_next
          grep -q '/mini-app/_next/' frontend/mini-app/out/index.html

      - name: Ruff
        run: ruff check . --output-format=github

      - name: Compile backend
        run: python -m compileall -q app tests

      - name: Apply migrations
        run: alembic upgrade head

      - name: Next Mini App architecture contract
        run: pytest -q tests/test_next_mini_app_contract.py

      - name: Feed domain
        run: >-
          pytest -q
          tests/test_feed_cards_query_count.py
          tests/test_feed_domain.py
          tests/test_feed_remix.py
          tests/test_feed_deep_links.py
          tests/test_feed_bot_callbacks.py

      - name: Generation and model contracts
        run: >-
          pytest -q
          tests/test_model_ui.py
          tests/test_model_capabilities.py
          tests/test_model_catalog.py
          tests/test_requested_generation_models.py
          tests/test_generation_batches.py
          tests/test_batch_recovery.py
          tests/test_music_generation.py

      - name: Prompt and trend services
        run: pytest -q tests/test_prompt_tools.py tests/test_trends_service.py

      - name: ROXY economy and pricing
        run: >-
          pytest -q
          tests/test_roxy_economy.py
          tests/test_internal_credits.py
          tests/test_roxy_pricing_denomination.py

      - name: Full backend and product regression
        id: regression
        shell: bash
        run: |
          set +e
          pytest -q -x --tb=short 2>&1 | tee /tmp/pytest-regression.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "--- regression tail ---"
            tail -n 120 /tmp/pytest-regression.log
            grep -E "FAILED|ERROR|AssertionError|TypeError|AttributeError|KeyError|IntegrityError|FileNotFoundError" /tmp/pytest-regression.log | tail -n 30 | while IFS= read -r line; do
              echo "::error title=Pytest regression::$line"
            done
            exit "$code"
          fi

      - name: Upload regression diagnostics
        if: failure() && steps.regression.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: pytest-regression-log
          path: /tmp/pytest-regression.log
          if-no-files-found: error
          retention-days: 7
