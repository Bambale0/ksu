name: Admin Contour

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: admin-contour-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Validate admin contour contracts
        run: |
          pytest -q \
            tests/test_admin_console.py \
            tests/test_admin_control_surface.py \
            tests/test_admin_security.py \
            tests/test_admin_telegram_security.py
