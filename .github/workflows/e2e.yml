name: ROXY E2E

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roxy-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ksu
          POSTGRES_USER: ksu
          POSTGRES_PASSWORD: ksu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ksu -d ksu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://ksu:ksu@127.0.0.1:5432/ksu
      REDIS_URL: redis://127.0.0.1:6379/0
      BOT_TOKEN: 123456789:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      BOT_USERNAME: roxy_e2e_bot
      TELEGRAM_WEBHOOK_SECRET: e2e-secret
      ONBOARDING_ENABLED: false
      PUBLIC_BASE_URL: http://127.0.0.1:8000
      START_BALANCE_ROX: "100000"
      ROX_PACKAGES_JSON: '{"e2e":{"amount":"100","credits":"100","currency":"RUB"}}'
      ABUSE_PROTECTION_ENABLED: false
      KIE_API_KEY: e2e-kie-key
      KIE_BASE_URL: http://127.0.0.1:18081
      CRYPTOPAY_API_TOKEN: e2e-crypto-token
      CRYPTOPAY_BASE_URL: http://127.0.0.1:18081
      TBANK_TERMINAL_KEY: e2e-terminal
      TBANK_PASSWORD: e2e-password
      TBANK_BASE_URL: http://127.0.0.1:18081
      YOOKASSA_SHOP_ID: e2e-shop
      YOOKASSA_SECRET_KEY: e2e-secret
      YOOKASSA_BASE_URL: http://127.0.0.1:18081
      PAYMENT_RETURN_URL: http://127.0.0.1:8000/mini-app/
      GENERATION_WORKER_POLL_SECONDS: "1"
      GENERATION_RECONCILE_INTERVAL_SECONDS: "1"
      GENERATION_RECONCILE_STALE_SECONDS: "0"
      GENERATION_SUBMISSION_UNKNOWN_TIMEOUT_SECONDS: "15"
      E2E_BASE_URL: http://127.0.0.1:8000
      E2E_REPORT_PATH: artifacts/e2e-report.json

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application and Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip install 'playwright>=1.50,<2'
          python -m playwright install --with-deps chromium

      - name: Apply migrations
        run: alembic upgrade head

      - name: Start deterministic provider, API and workers
        run: |
          mkdir -p artifacts
          python -m uvicorn e2e.fake_provider:app --host 127.0.0.1 --port 18081 > artifacts/fake-provider.log 2>&1 &
          echo $! > artifacts/fake-provider.pid
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > artifacts/app.log 2>&1 &
          echo $! > artifacts/app.pid
          python -m app.workers.generation > artifacts/generation-worker.log 2>&1 &
          echo $! > artifacts/generation-worker.pid
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18081/health >/dev/null && curl -fsS http://127.0.0.1:8000/health/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo 'E2E services did not become ready' >&2
          cat artifacts/fake-provider.log || true
          cat artifacts/app.log || true
          cat artifacts/generation-worker.log || true
          exit 1

      - name: Run real browser journeys
        run: python e2e/roxy_browser_e2e.py

      - name: Print E2E report
        if: always()
        run: |
          test ! -f artifacts/e2e-report.json || cat artifacts/e2e-report.json
          echo '--- app log tail ---'
          tail -n 120 artifacts/app.log 2>/dev/null || true
          echo '--- generation worker log tail ---'
          tail -n 120 artifacts/generation-worker.log 2>/dev/null || true
          echo '--- fake provider log tail ---'
          tail -n 120 artifacts/fake-provider.log 2>/dev/null || true

      - name: Upload browser traces, screenshots and service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roxy-e2e-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
