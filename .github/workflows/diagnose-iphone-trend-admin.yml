name: Diagnostic iPhone trend admin

on:
  push:
    branches:
      - diagnostic/iphone-add-trend-20261029

permissions:
  contents: read

concurrency:
  group: diagnostic-iphone-trend-admin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --init --ipc=host
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/mini-app/package-lock.json
      - name: Install Mini App dependencies
        working-directory: frontend/mini-app
        run: npm ci
      - name: Install Playwright test runtime
        working-directory: frontend/mini-app
        run: npm install --no-save @playwright/test@1.56.1
      - name: Report browser codec capabilities
        working-directory: frontend/mini-app
        run: |
          node --input-type=module <<'NODE'
          import { chromium, webkit } from '@playwright/test';
          for (const browserType of [chromium, webkit]) {
            const browser = await browserType.launch({ headless: true });
            try {
              const page = await browser.newPage();
              const codecs = await page.evaluate(() => {
                const video = document.createElement('video');
                const types = ['video/mp4', 'video/mp4; codecs="avc1.42C00A"', 'video/webm; codecs="vp8"'];
                return Object.fromEntries(types.map(type => [type, video.canPlayType(type)]));
              });
              console.log(JSON.stringify({ browser: browserType.name(), codecs }));
            } finally {
              await browser.close();
            }
          }
          NODE
      - name: Run trend admin interaction in Chromium and WebKit
        working-directory: frontend/mini-app
        run: >-
          npx playwright test
          e2e/trend-admin-mobile-interaction.spec.mjs
          --project=chromium
          --project=webkit-mobile
          --max-failures=0
      - name: Upload diagnostic report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-trend-admin-${{ github.sha }}
          path: |
            frontend/mini-app/playwright-report
            frontend/mini-app/test-results
          if-no-files-found: ignore
          retention-days: 7
