name: Apply profile share hotfix

on:
  push:
    branches:
      - fix/restore-profile-share

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/restore-profile-share
          fetch-depth: 0
      - name: Restore profile sharing contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          me_path = Path('app/api/v1/me.py')
          me = me_path.read_text()
          old = 'from app.services.profile_preferences import ProfilePreferenceService\n'
          new = old + 'from app.services.partner import PartnerService\n'
          if 'from app.services.partner import PartnerService' not in me:
              if old not in me:
                  raise SystemExit('me.py import anchor not found')
              me = me.replace(old, new, 1)
          anchor = '        "telegram_id": user.telegram_id,\n'
          addition = anchor + '        "profile_link": PartnerService.profile_link(user.telegram_id),\n'
          if '"profile_link": PartnerService.profile_link(user.telegram_id)' not in me:
              if anchor not in me:
                  raise SystemExit('me.py response anchor not found')
              me = me.replace(anchor, addition, 1)
          me_path.write_text(me)

          types_path = Path('frontend/mini-app/lib/types.ts')
          types = types_path.read_text()
          anchor = 'export type Me = {\n  id: string;\n  telegram_id: number;\n'
          replacement = anchor + '  profile_link?: string | null;\n'
          if 'profile_link?: string | null;' not in types.split('export type Me = {', 1)[1].split('};', 1)[0]:
              if anchor not in types:
                  raise SystemExit('Me type anchor not found')
              types = types.replace(anchor, replacement, 1)
          types_path.write_text(types)

          app_path = Path('frontend/mini-app/components/roxy-social-app.tsx')
          app = app_path.read_text()
          anchor = 'function profileLink(stats: PartnerStats | null, me: Me | null): string | null {\n  if (stats?.profile_link) return stats.profile_link;\n'
          replacement = 'function profileLink(stats: PartnerStats | null, me: Me | null): string | null {\n  if (me?.profile_link) return me.profile_link;\n  if (stats?.profile_link) return stats.profile_link;\n'
          if 'if (me?.profile_link) return me.profile_link;' not in app:
              if anchor not in app:
                  raise SystemExit('profileLink anchor not found')
              app = app.replace(anchor, replacement, 1)
          app = app.replace('aria-label="Скопировать ссылку на профиль"', 'aria-label="Поделиться профилем"', 1)
          app_path.write_text(app)

          test_path = Path('tests/test_profile_share_contract.py')
          test_path.write_text('''from pathlib import Path\n\nfrom app.core.config import settings\nfrom app.services.partner import PartnerService\n\n\ndef test_me_owns_profile_share_link_contract() -> None:\n    source = Path("app/api/v1/me.py").read_text()\n    assert "\\\"profile_link\\\": PartnerService.profile_link(user.telegram_id)" in source\n\n\ndef test_profile_share_does_not_depend_on_partner_stats() -> None:\n    source = Path("frontend/mini-app/components/roxy-social-app.tsx").read_text()\n    assert "if (me?.profile_link) return me.profile_link;" in source\n    assert 'aria-label="Поделиться профилем"' in source\n\n\ndef test_profile_link_is_direct_main_mini_app(monkeypatch) -> None:\n    monkeypatch.setattr(settings, "bot_username", "RoxyExampleBot")\n    assert PartnerService.profile_link(123456) == (\n        "https://t.me/RoxyExampleBot?startapp=profile_123456_ref_123456"\n    )\n''')
          PY

          git rm .github/workflows/profile-share-hotfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/v1/me.py frontend/mini-app/lib/types.ts frontend/mini-app/components/roxy-social-app.tsx tests/test_profile_share_contract.py
          git diff --cached --check
          git commit -m "fix: restore own profile sharing"
          git push origin HEAD:fix/restore-profile-share
