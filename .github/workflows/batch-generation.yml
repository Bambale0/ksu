name: Batch Generation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ksu
          POSTGRES_USER: ksu
          POSTGRES_PASSWORD: ksu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ksu -d ksu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://ksu:ksu@127.0.0.1:5432/ksu
      REDIS_URL: redis://127.0.0.1:6379/0
      BOT_TOKEN: ""
      TELEGRAM_WEBHOOK_SECRET: test-secret
      ONBOARDING_ENABLED: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Migrate
        run: alembic upgrade head
      - name: Test batch contracts
        shell: bash
        run: |
          set +e
          pytest -q --tb=short tests/test_generation_batches.py tests/test_batch_recovery.py tests/test_batch_parameter_normalization.py 2>&1 | tee /tmp/pytest-batch.log
          code=${PIPESTATUS[0]}
          exit "$code"
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch-pytest-diagnostics
          path: /tmp/pytest-batch.log
          retention-days: 7
