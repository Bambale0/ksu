<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ROXY — Пакетная обработка</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{color-scheme:dark;--bg:#09070f;--p:#15101d;--line:#70439a88;--muted:#b9afc5;--grad:linear-gradient(135deg,#8f55ff,#ff57bf);--ok:#78e0ae;--bad:#ff829f}*{box-sizing:border-box}body{margin:auto;max-width:780px;min-height:100vh;padding:18px 16px 36px;font:14px system-ui;color:#fff;background:radial-gradient(circle at 20% 0,#8d3cff33,transparent 32%),var(--bg)}button,input,select,textarea{font:inherit;color:inherit}.top,.head{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{border:0;background:transparent;font-weight:950}.bal,.pill{padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:#ffffff08;font-size:11px}h1{font-size:33px;letter-spacing:-.045em;margin:18px 0 6px}.lead,.muted{color:var(--muted);line-height:1.5}.card{margin-top:14px;padding:16px;border:1px solid var(--line);border-radius:22px;background:#ffffff09}.grid{display:grid;gap:12px}.field{display:grid;gap:6px}.label{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:#ded4e8}select,textarea,input[type=number]{width:100%;border:1px solid var(--line);border-radius:14px;background:#0c0911;padding:11px;outline:0}textarea{min-height:100px;resize:vertical}.drop{display:grid;place-items:center;min-height:104px;text-align:center;border:1px dashed #925bd5;border-radius:18px;background:#925bd512;cursor:pointer}.drop input{position:absolute;opacity:0;width:1px}.files{display:grid;gap:7px}.file{display:grid;grid-template-columns:30px minmax(0,1fr) 28px;align-items:center;gap:8px;padding:8px;border:1px solid #ffffff15;border-radius:13px}.file b{display:grid;place-items:center;height:28px;border-radius:9px;background:#985bff20}.file span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}.x{border:0;background:transparent;color:var(--muted);font-size:20px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.primary,.secondary{min-height:47px;border-radius:15px;font-weight:900}.primary{border:0;background:var(--grad)}.secondary{border:1px solid var(--line);background:#ffffff08}.primary:disabled,.secondary:disabled{opacity:.45}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.metric{padding:10px;border:1px solid #ffffff12;border-radius:13px;background:#0003}.metric small{display:block;color:var(--muted);font-size:9px}.metric strong{display:block;margin-top:4px}.progress{height:7px;border-radius:99px;background:#ffffff12;overflow:hidden}.progress i{display:block;height:100%;background:var(--grad)}.items{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.item{padding:8px;border:1px solid #ffffff12;border-radius:13px;background:#0003;min-width:0}.item img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:9px}.item strong,.item small{display:block;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.item small{font-size:9px;color:var(--muted)}.pill.succeeded{color:var(--ok)}.pill.failed,.pill.partial{color:var(--bad)}details{border:1px solid #ffffff12;border-radius:14px;padding:10px}summary{cursor:pointer;font-weight:800}.toast{position:fixed;display:none;left:16px;right:16px;bottom:18px;max-width:720px;margin:auto;padding:12px;border:1px solid var(--line);border-radius:15px;background:#21162e}.toast.on{display:block}@media(max-width:430px){.row{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}}
</style></head><body>
<div class="top"><button id="catalog" class="brand">✦ ROXY</button><span id="balance" class="bal">Баланс —</span></div><h1>Пакетная обработка</h1><p class="lead">2–20 изображений, один prompt и настройки. Каждое изображение запускается отдельной генерацией.</p>
<section class="card grid"><label class="field"><span class="label">Модель</span><select id="model"><option>Загружаю…</option></select></label><label class="field"><span class="label">Prompt</span><textarea id="prompt" placeholder="Что сделать с каждым изображением?"></textarea></label><label class="drop"><span><b>Добавить изображения</b><br><small class="muted">JPG, PNG, WEBP · от 2 до 20</small></span><input id="picker" type="file" accept="image/*" multiple></label><div id="files" class="files"></div><details><summary>Дополнительные параметры</summary><div class="grid" style="margin-top:10px"><label class="field"><span class="label">JSON параметров модели</span><textarea id="params">{}</textarea></label><label class="field"><span class="label">Длительность, сек. если требуется</span><input id="seconds" type="number" min="1" max="600"></label></div></details><div class="row"><button id="quote" class="secondary">Рассчитать стоимость</button><button id="start" class="primary">Запустить пакет</button></div><div id="quoteBox" class="metrics" hidden><div class="metric"><small>Изображений</small><strong id="qc">—</strong></div><div class="metric"><small>За файл</small><strong id="qp">—</strong></div><div class="metric"><small>Всего</small><strong id="qt">—</strong></div></div></section>
<section class="card grid"><div class="head"><div><span class="label">История</span><h2 style="margin:4px 0 0">Последние пакеты</h2></div><button id="refresh" class="secondary">Обновить</button></div><div id="jobs" class="grid"><span class="muted">Загрузка…</span></div></section><div id="toast" class="toast"></div>
<script>(()=>{const tg=window.Telegram?.WebApp;try{tg?.ready();tg?.expand()}catch{}const S={files:[],urls:[],busy:false,active:null,timer:null};const $=id=>document.getElementById(id);const INPUTS=new Set(['image_url','image_urls','image_input','input_urls']);function headers(json=false){const h={Accept:'application/json'};if(tg?.initData)h['X-Telegram-Init-Data']=tg.initData;if(json)h['Content-Type']='application/json';return h}async function api(path,init={}){const json=init.body&&!(init.body instanceof FormData);const r=await fetch(path,{...init,credentials:'same-origin',cache:'no-store',headers:{...headers(json),...(init.headers||{})}});const d=r.status===204?null:await r.json().catch(()=>null);if(!r.ok)throw Error(d?.detail||d?.message||`HTTP ${r.status}`);return d}const rox=v=>v==null?'—':`${Number(v).toLocaleString('ru-RU',{maximumFractionDigits:2})} ROX`;function toast(t){$('toast').textContent=t;$('toast').classList.add('on');setTimeout(()=>$('toast').classList.remove('on'),2800)}function busy(v,t='Работаю…'){S.busy=v;$('quote').disabled=v;$('start').disabled=v;$('picker').disabled=v;$('start').textContent=v?t:'Запустить пакет'}$('catalog').onclick=()=>location.assign('/mini-app/?route=catalog');function compatible(m){if(m?.media_type!=='image')return false;const known=new Set(m.known_fields||[]);return [...INPUTS].some(k=>known.has(k))}async function boot(){const [me,c]=await Promise.all([api('/api/v1/me'),api('/api/v1/generations/models')]);$('balance').textContent=`Баланс ${rox(me.balance_rox)}`;const ms=(c.models||[]).filter(compatible);$('model').replaceChildren(...ms.map(m=>{const o=document.createElement('option');o.value=m.id;o.textContent=`${m.title} · от ${rox(m.effective_price_rox??m.price_rox)}`;return o}));if(!ms.length){const o=document.createElement('option');o.textContent='Нет совместимых image-edit моделей';$('model').append(o)}}function renderFiles(){$('files').replaceChildren(...S.files.map((f,i)=>{const r=document.createElement('div');r.className='file';const b=document.createElement('b');b.textContent=i+1;const n=document.createElement('span');n.textContent=f.name;const x=document.createElement('button');x.className='x';x.textContent='×';x.onclick=()=>{S.files.splice(i,1);S.urls=[];renderFiles();$('quoteBox').hidden=true};r.append(b,n,x);return r}))}$('picker').onchange=e=>{const seen=new Set(S.files.map(f=>`${f.name}:${f.size}:${f.lastModified}`));for(const f of [...e.target.files].filter(f=>f.type.startsWith('image/'))){const k=`${f.name}:${f.size}:${f.lastModified}`;if(!seen.has(k)&&S.files.length<20){seen.add(k);S.files.push(f)}}S.urls=[];e.target.value='';renderFiles();$('quoteBox').hidden=true};function base(){if(!$('model').value)throw Error('Выберите модель');if(S.files.length<2||S.files.length>20)throw Error('Добавьте от 2 до 20 изображений');let p;try{p=JSON.parse($('params').value.trim()||'{}')}catch{throw Error('Параметры должны быть корректным JSON')}if(!p||Array.isArray(p)||typeof p!=='object')throw Error('Параметры должны быть JSON-объектом');for(const k of INPUTS)if(p[k])throw Error(`Уберите ${k}: batch назначает изображения сам`);const raw=$('seconds').value.trim(),sec=raw?Number(raw):null;if(sec!==null&&(!Number.isInteger(sec)||sec<1||sec>600))throw Error('Длительность: 1–600 сек.');return{model_id:$('model').value,prompt:$('prompt').value.trim(),parameters:p,billing_seconds:sec}}async function uploads(){if(S.urls.length===S.files.length)return S.urls;const urls=[];for(let i=0;i<S.files.length;i++){busy(true,`Загрузка ${i+1}/${S.files.length}…`);const f=new FormData();f.append('file',S.files[i],S.files[i].name);const d=await api('/api/v1/uploads/kie',{method:'POST',body:f});urls.push(d.url)}S.urls=urls;return urls}async function payload(){return{...base(),input_urls:await uploads(),reference_ids:[]}}$('quote').onclick=async()=>{if(S.busy)return;try{busy(true,'Готовлю…');const d=await api('/api/v1/batch-generations/quote',{method:'POST',body:JSON.stringify(await payload())});$('qc').textContent=d.input_count;$('qp').textContent=rox(d.per_item_cost_credits);$('qt').textContent=d.admin_free?'Бесплатно':rox(d.total_cost_credits);$('quoteBox').hidden=false}catch(e){toast(e.message)}finally{busy(false)}};const idem=p=>`${p}:${Date.now()}:${Math.random().toString(16).slice(2)}`;$('start').onclick=async()=>{if(S.busy)return;try{busy(true,'Запускаю…');const d=await api('/api/v1/batch-generations',{method:'POST',headers:{'Idempotency-Key':idem('batch')},body:JSON.stringify(await payload())});S.files=[];S.urls=[];renderFiles();$('quoteBox').hidden=true;toast(`Пакет запущен: ${d.input_count}`);S.active=d.id;await jobs();poll(d.id);try{tg?.HapticFeedback?.notificationOccurred('success')}catch{}}catch(e){toast(e.message)}finally{busy(false)}};const hs=s=>({running:'В работе',succeeded:'Готово',partial:'Частично',failed:'Ошибка',queued:'В очереди'}[s]||s);function item(it){const d=document.createElement('div');d.className='item';const g=it.generation||{};if(g.result_url){const im=document.createElement('img');im.src=g.result_url;im.loading='lazy';im.alt=`Результат ${it.ordinal+1}`;d.append(im)}const b=document.createElement('strong');b.textContent=`#${it.ordinal+1} · ${hs(g.status)}`;const s=document.createElement('small');s.textContent=g.error||rox(g.cost_credits);d.append(b,s);return d}function card(j){const c=document.createElement('article');c.className='card grid';c.style.marginTop=0;const h=document.createElement('div');h.className='head';const t=document.createElement('div');const l=document.createElement('span');l.className='label';l.textContent=j.model_id;const h2=document.createElement('h2');h2.style.margin='4px 0 0';h2.textContent=`${j.succeeded_count}/${j.input_count} готово`;t.append(l,h2);const st=document.createElement('span');st.className=`pill ${j.status}`;st.textContent=hs(j.status);h.append(t,st);c.append(h);const p=document.createElement('div');p.className='progress';const i=document.createElement('i');i.style.width=`${Math.min(100,Math.max(0,Number(j.progress_percent)||0))}%`;p.append(i);c.append(p);const m=document.createElement('div');m.className='metrics';[['Успешно',j.succeeded_count],['Ошибок',j.failed_count],['Списано',j.admin_free?'Бесплатно':rox(j.total_charged_credits)]].forEach(([a,b])=>{const x=document.createElement('div');x.className='metric';const s=document.createElement('small');s.textContent=a;const q=document.createElement('strong');q.textContent=b;x.append(s,q);m.append(x)});c.append(m);if(j.items?.length){const its=document.createElement('div');its.className='items';j.items.forEach(x=>its.append(item(x)));c.append(its)}if(j.failed_count>0&&!['running','queued'].includes(j.status)){const r=document.createElement('button');r.className='secondary';r.textContent='Повторить ошибки';r.onclick=()=>retry(j.id);c.append(r)}return c}async function jobs(){try{const d=await api('/api/v1/batch-generations?limit=10');const box=$('jobs');box.replaceChildren();if(!d.items?.length){const s=document.createElement('span');s.className='muted';s.textContent='Пакетов пока нет.';box.append(s);return}d.items.forEach(j=>box.append(card(j)));if(!S.active){const a=d.items.find(j=>j.status==='running');if(a)poll(a.id)}}catch(e){toast(e.message)}}$('refresh').onclick=jobs;async function retry(id){try{const q=await api(`/api/v1/batch-generations/${id}/retry-quote`);if(!q.failed_count)return toast('Ошибок для повтора нет');const cost=q.admin_free?'бесплатно':rox(q.total_cost_credits);if(!confirm(`Повторить ${q.failed_count} задач? Стоимость: ${cost}`))return;const d=await api(`/api/v1/batch-generations/${id}/retry`,{method:'POST',headers:{'Idempotency-Key':idem('retry')}});toast(`Повтор запущен: ${d.retried_count}`);S.active=id;await jobs();poll(id)}catch(e){toast(e.message)}}function poll(id){S.active=id;if(S.timer)clearTimeout(S.timer);const tick=async()=>{try{const j=await api(`/api/v1/batch-generations/${id}`);await jobs();if(['succeeded','partial','failed'].includes(j.status)){S.active=null;S.timer=null;toast(j.status==='succeeded'?'Пакет готов':'Пакет завершён');return}}catch{}S.timer=setTimeout(tick,2500)};S.timer=setTimeout(tick,700)}Promise.all([boot(),jobs()]).catch(e=>toast(e.message))})();</script></body></html>
